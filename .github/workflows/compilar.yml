# Compilar el instalador del Tutor Okirys
#
# POR QUE SE COMPILA AQUI Y NO EN EL COMPUTADOR DE NICOLAS
# =========================================================
# Smart App Control de Windows 11 mata los `build.rs` de Rust antes de que
# se ejecuten:
#
#     could not execute process ... (never executed)
#     Una directiva de Control de aplicaciones bloqueó este archivo.
#     (os error 4551)
#
# Comprobado el 04/11/2026 y otra vez el 05/11/2026. No es un permiso que
# se pueda conceder: Smart App Control solo se vuelve a encender
# reinstalando Windows, así que apagarlo es una puerta de un solo sentido.
# Una máquina de GitHub no lo lleva, y compila igual.
#
# De paso resuelve otra cosa: el .exe queda publicado en una URL fija, que
# es lo que enlaza la página para que el alumno lo descargue.
#
# QUE SE PUBLICA, Y POR QUE SE PUEDE
# ===================================
# Solo `programa/`, que es exactamente lo que ya va en la USB de cada
# alumno. El contenido del curso NO viaja —`curriculo.js` va vacío, lo
# llena el alumno con sus PDF— y el generador viaja CIFRADO: sin una
# licencia válida no se abre. Comprobado que no lleva ninguna credencial.

name: Compilar instalador

on:
  push:
    tags: ["v*"]          # un tag `v1.0.0` publica una versión
  workflow_dispatch: {}   # o se lanza a mano desde la pestaña Actions

permissions:
  contents: write         # hace falta para crear la Release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # GUARDIA · que el programa esté presente.
      #
      # `programa/` lo copia `empaquetar.py`. Si alguien etiqueta una
      # versión sin haberlo regenerado, Tauri compilaría igual y saldría
      # un instalador con una ventana en blanco — y eso no se descubre
      # hasta que un alumno lo instala.
      - name: Comprobar que programa/ está
        shell: bash
        run: |
          test -f programa/tutor.html || {
            echo "::error::falta programa/tutor.html — corre empaquetar.py y vuelve a subir"
            exit 1
          }
          test -f programa/generador-cifrado.js || {
            echo "::error::falta el generador cifrado en programa/"
            exit 1
          }
          echo "programa/ tiene $(ls programa | wc -l) archivos"

      # Y que no se haya colado una credencial. Este repositorio es
      # público: lo que entre aquí, entra para siempre.
      - name: Comprobar que no van credenciales
        shell: bash
        run: |
          if grep -rqnE "(sk-[A-Za-z0-9_-]{12,}|gsk_[A-Za-z0-9]{12,}|service_role|sb_secret)" programa/; then
            echo "::error::hay algo con pinta de credencial en programa/"
            grep -rnE "(sk-[A-Za-z0-9_-]{12,}|gsk_[A-Za-z0-9]{12,}|service_role|sb_secret)" programa/ | head -5
            exit 1
          fi
          echo "sin credenciales"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Compilar
        run: npx tauri build

      # GUARDIA · que de verdad haya salido un instalador. `tauri build`
      # puede terminar en 0 y no dejar bundle si la configuración cambia.
      - name: Comprobar el instalador
        shell: bash
        run: |
          ls -la src-tauri/target/release/bundle/nsis/ || true
          n=$(find src-tauri/target/release/bundle -name "*.exe" -o -name "*.msi" | wc -l)
          test "$n" -gt 0 || { echo "::error::no se generó ningún instalador"; exit 1; }
          find src-tauri/target/release/bundle -name "*.exe" -o -name "*.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: Tutor-Okirys-instalador
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Solo al etiquetar. La URL queda fija y es la que enlaza la web:
      #   .../releases/latest/download/Tutor-Okirys.exe
      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
